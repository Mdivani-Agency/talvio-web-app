type resumes {
  id: UUID!
  user_id: UUID!
  name: String!
  type: resume_type!
  template_key: String!
  color: String!
  font_size: resume_font_size!
  font_family: String
  content: JSON!
  pdf_url: String
  pdf_media_key: String
  created_at: Datetime!
  updated_at: Datetime!
}

type resumesEdge {
  cursor: String!
  node: resumes
}

type resumesConnection {
  edges: [resumesEdge!]!
  pageInfo: PageInfo!
}

input resumesFilter {
  id: UUIDFilter
  user_id: UUIDFilter
  type: resume_typeFilter
}

input resumesOrderBy {
  updated_at: OrderByDirection
  created_at: OrderByDirection
}

type user_credits {
  user_id: UUID!
  balance: Int!
  updated_at: Datetime!
}

type user_creditsEdge {
  cursor: String!
  node: user_credits
}

type user_creditsConnection {
  edges: [user_creditsEdge!]!
  pageInfo: PageInfo!
}

input user_creditsFilter {
  user_id: UUIDFilter
}

input user_creditsOrderBy {
  updated_at: OrderByDirection
}

type Query {
  profilesCollection(
    first: Int
    last: Int
    before: Cursor
    after: Cursor
    offset: Int
    filter: profilesFilter
    orderBy: [profilesOrderBy!]
  ): profilesConnection
  contactsCollection(
    first: Int
    last: Int
    before: Cursor
    after: Cursor
    offset: Int
    filter: contactsFilter
    orderBy: [contactsOrderBy!]
  ): contactsConnection
  experiencesCollection(
    first: Int
    last: Int
    before: Cursor
    after: Cursor
    offset: Int
    filter: experiencesFilter
    orderBy: [experiencesOrderBy!]
  ): experiencesConnection
  educationsCollection(
    first: Int
    last: Int
    before: Cursor
    after: Cursor
    offset: Int
    filter: educationsFilter
    orderBy: [educationsOrderBy!]
  ): educationsConnection
  projectsCollection(
    first: Int
    last: Int
    before: Cursor
    after: Cursor
    offset: Int
    filter: projectsFilter
    orderBy: [projectsOrderBy!]
  ): projectsConnection
  recommendationsCollection(
    first: Int
    last: Int
    before: Cursor
    after: Cursor
    offset: Int
    filter: recommendationsFilter
    orderBy: [recommendationsOrderBy!]
  ): recommendationsConnection
  skillsCollection(
    first: Int
    last: Int
    before: Cursor
    after: Cursor
    offset: Int
    filter: skillsFilter
    orderBy: [skillsOrderBy!]
  ): skillsConnection
  toolsCollection(
    first: Int
    last: Int
    before: Cursor
    after: Cursor
    offset: Int
    filter: toolsFilter
    orderBy: [toolsOrderBy!]
  ): toolsConnection
  linksCollection(
    first: Int
    last: Int
    before: Cursor
    after: Cursor
    offset: Int
    filter: linksFilter
    orderBy: [linksOrderBy!]
  ): linksConnection
  languagesCollection(
    first: Int
    last: Int
    before: Cursor
    after: Cursor
    offset: Int
    filter: languagesFilter
    orderBy: [languagesOrderBy!]
  ): languagesConnection
  resumesCollection(
    first: Int
    last: Int
    before: Cursor
    after: Cursor
    offset: Int
    filter: resumesFilter
    orderBy: [resumesOrderBy!]
  ): resumesConnection
  user_creditsCollection(
    first: Int
    last: Int
    before: Cursor
    after: Cursor
    offset: Int
    filter: user_creditsFilter
    orderBy: [user_creditsOrderBy!]
  ): user_creditsConnection
}

input resumesInsertInput {
  id: UUID
  user_id: UUID
  name: String
  type: resume_type
  template_key: String
  color: String
  font_size: resume_font_size
  font_family: String
  content: JSON
  pdf_url: String
  pdf_media_key: String
}

input resumesUpdateInput {
  name: String
  type: resume_type
  template_key: String
  color: String
  font_size: resume_font_size
  font_family: String
  content: JSON
  pdf_url: String
  pdf_media_key: String
}

type resumesInsertResponse {
  records: [resumes!]!
  affectedCount: Int!
}

type resumesUpdateResponse {
  records: [resumes!]!
  affectedCount: Int!
}

type resumesDeleteResponse {
  records: [resumes!]!
  affectedCount: Int!
}

type Mutation {
  save_profile(p_payload: JSON): String
  generate_pdf(p_resume_id: UUID): String
  insertIntoresumesCollection(objects: [resumesInsertInput!]!): resumesInsertResponse
  updateresumesCollection(
    set: resumesUpdateInput!
    filter: resumesFilter
    atMost: Int
  ): resumesUpdateResponse
  deleteFromresumesCollection(
    filter: resumesFilter
    atMost: Int
  ): resumesDeleteResponse
}

name: CI

# PRs and pushes: quality, local database tests, Playwright, then a release gate.
# Push to main / development: release gate → db push → Vercel CLI deploy.
# The gate fails unless quality and local-e2e both succeed, including when one is skipped.
# Push runs stay queued. Each hosted mutation refuses a checkout that is no longer the branch tip.
# Vercel Git deployments are off for every branch (see vercel.json). CLI deploys use a pinned CLI.
#
# Vercel CLI credentials are repository-scoped (same project for main and
# development): VERCEL_TOKEN is a secret; VERCEL_ORG_ID and VERCEL_PROJECT_ID
# may be secrets or variables.
# Supabase db push still uses GitHub Environments when refs differ:
#   development ← branch development
#   production  ← branch main
#   SUPABASE_ACCESS_TOKEN is an environment secret.
#   SUPABASE_PROJECT_REF is an environment variable (secret also accepted).

on:
  pull_request:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_BASE_URL: http://localhost:3002
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3002
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: stub-publishable-key
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: GraphQL types in sync
        run: yarn codegen && git diff --exit-code -- lib/graphql/generated.ts

      - name: Build
        run: yarn build

  local-e2e:
    name: Local database and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: yarn install --immutable

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium firefox webkit

      - name: Local database tests and Playwright
        run: yarn test:e2e:local

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  release-gate:
    name: Release gate
    needs: [quality, local-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Require quality and local end-to-end
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          LOCAL_E2E_RESULT: ${{ needs.local-e2e.result }}
        run: node scripts/release-gate.mjs

  db-push:
    name: Push migrations
    needs: release-gate
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Require Supabase credentials
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "::error::Set environment secret SUPABASE_ACCESS_TOKEN and environment variable SUPABASE_PROJECT_REF."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refuse a stale hosted mutation
        run: node scripts/require-branch-head.mjs

      - name: Push pending migrations
        run: supabase db push --yes --project-ref "${SUPABASE_PROJECT_REF}"

  deploy:
    name: Deploy to Vercel
    needs: [release-gate, db-push]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
      # vercel build installs with the packageManager pin (Yarn 4). Without this
      # it shells out to Yarn 1 and exits before compile.
      ENABLE_EXPERIMENTAL_COREPACK: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Require Vercel credentials
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::error::Set repository secret VERCEL_TOKEN and repository secrets or variables VERCEL_ORG_ID and VERCEL_PROJECT_ID."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@60.1.3

      - name: Pull Vercel environment
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
          else
            vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"
          fi

      - name: Build
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            vercel build --prod --token="${VERCEL_TOKEN}"
          else
            vercel build --token="${VERCEL_TOKEN}"
          fi

      - name: Refuse a stale hosted mutation
        run: node scripts/require-branch-head.mjs

      - name: Deploy
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
          else
            vercel deploy --prebuilt --token="${VERCEL_TOKEN}"
          fi

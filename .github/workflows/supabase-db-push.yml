name: Supabase db push

# The one hosted migration path. ci.yml calls it after the release gate on a
# push; db-migrations.yml calls it after its preflight on a manual dispatch.
# `supabase link` makes the CLI use the IPv4 connection pooler; GitHub runners
# cannot reach the IPv6-only direct database host. The CLI reads the database
# password from SUPABASE_DB_PASSWORD, so it never appears in a command line.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  push:
    name: Push migrations
    # Only branches that own a hosted project; a feature branch must not migrate talvio-dev.
    if: github.ref_name == 'main' || github.ref_name == 'development'
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One hosted migration per branch at a time. A newer pending job replaces an
    # older pending one, so db-migrations.yml refuses to queue while CI is running.
    concurrency:
      group: db-migrations-${{ github.ref }}
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Require Supabase credentials
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_REF}" ] || [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::error::Set environment secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD and environment variable SUPABASE_PROJECT_REF."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: ./.github/actions/setup-supabase-cli

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runs after the concurrency wait, so a run that queued behind a newer commit stops here.
      - name: Refuse a stale hosted mutation
        run: node scripts/require-branch-head.mjs

      - name: Link Supabase project
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Push pending migrations
        run: supabase db push --linked --yes

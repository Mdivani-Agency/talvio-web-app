name: Database

# Apply pending migrations to the hosted project after merge.
# Never runs on pull requests. Never resets a database.
# Only fires when this push changes supabase/migrations/.
on:
  push:
    branches:
      - main
      - development
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: db-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    name: Push migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF_DEV: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
      SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve target project
        id: target
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "project_ref=${SUPABASE_PROJECT_REF_PROD}" >> "$GITHUB_OUTPUT"
            echo "label=talvio-prod" >> "$GITHUB_OUTPUT"
          else
            echo "project_ref=${SUPABASE_PROJECT_REF_DEV}" >> "$GITHUB_OUTPUT"
            echo "label=talvio-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when hosted project is not configured
        if: env.SUPABASE_ACCESS_TOKEN == '' || steps.target.outputs.project_ref == ''
        run: |
          echo "::notice::Skipping db push for ${{ steps.target.outputs.label }} — set repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF_DEV / SUPABASE_PROJECT_REF_PROD."

      - name: Set up Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != '' && steps.target.outputs.project_ref != ''
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Push pending migrations
        if: env.SUPABASE_ACCESS_TOKEN != '' && steps.target.outputs.project_ref != ''
        run: supabase db push --yes --project-ref "${{ steps.target.outputs.project_ref }}"
